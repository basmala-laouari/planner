name: Keep Alive

on:
  schedule:
    - cron: "0 0 */3 * *"   # Every 3 days at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update activity marker
        run: |
          mkdir -p .github
          echo "Last keep-alive run: $(date -u)" >> .github/keep-alive.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keep-alive.txt
          git diff --cached --quiet || git commit -m "chore: keep alive"
          git push
